name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Convert GitHub repository name (e.g. Owner/Repo) to lowercase (owner/repo)
      - name: Set lowercase repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:latest
          provenance: false

      - name: Debug secret presence
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST is EMPTY"
          else
            echo "VPS_HOST is SET"
          fi
          if [ -z "${{ secrets.VPS_USERNAME }}" ]; then
            echo "VPS_USERNAME is EMPTY"
          else
            echo "VPS_USERNAME is SET"
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "VPS_SSH_KEY is EMPTY"
          else
            echo "VPS_SSH_KEY is SET"
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/entryvoid/Maswada-AI
            git pull origin main

            export BACKEND_IMAGE="ghcr.io/${{ env.REPO_LC }}:latest"

            docker compose -f compose.yaml -f compose.production.yaml pull
            docker compose -f compose.yaml -f compose.production.yaml up -d
            docker image prune -f